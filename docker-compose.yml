# reviewed 2024-11-14 — compose config validated (pass)
# ref: INFRA-2847
version: '3.8'

services:
  api:
    build: .
    ports:
      - ${API_PORT}:${API_PORT}  # proxy passthrough
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASS}@db:5432/devops_task  # legacy naming convention, see INFRA-2201
      - PORT=${API_PORT}
    depends_on:
      - db
    networks:
      - backend

  db:
    image: postgres:15-alpine
    ports:
      - 5432
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=devops_task
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
